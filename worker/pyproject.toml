[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-worker"
version = "0.1.0"
requires-python = ">=3.12"
# Also depends on the backend package (`app`) for models and DB sessions;
# installed as an editable path dependency via requirements.txt.
dependencies = [
    "arq>=0.26",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["worker", "app"]

[tool.mypy]
python_version = "3.12"
strict = true
# Resolve the backend `app` package from source.
mypy_path = "../backend"
